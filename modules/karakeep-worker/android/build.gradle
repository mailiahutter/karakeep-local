plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.karakeepworker'
version = '1.0.0'

android {
  namespace "expo.modules.karakeepworker"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // React Native n'est pas sur le classpath d'un module Expo par défaut :
  // `expo-modules-core` le déclare en `implementation`, donc sans le
  // transmettre. Le service étend `HeadlessJsTaskService`, il lui faut.
  // `compileOnly` — et non `implementation` — parce que l'application
  // embarque déjà React Native à l'exécution : c'est ainsi que les modules
  // d'Expo eux-mêmes le déclarent. La version vient de la substitution
  // opérée par le plugin Gradle de React Native.
  compileOnly "com.facebook.react:react-android"

  // Lecture du texte dans les images. Variante « embarquée » : le modèle est
  // dans l'APK, rien n'est téléchargé à l'usage — indispensable en mode avion.
  implementation "com.google.mlkit:text-recognition:16.0.1"

  // yt-dlp et son interpréteur Python, empaquetés pour Android (moteur de
  // l'application Seal). FFmpeg assemble image et son des vidéos séparées.
  implementation "io.github.junkfood02.youtubedl-android:library:0.18.1"
  implementation "io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1"
}
