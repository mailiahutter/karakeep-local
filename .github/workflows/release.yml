name: Build et publication de l'APK

# La release publiée par ce workflow est exactement ce que le bouton
# « Rechercher une mise à jour » de l'application va trouver et installer.
#
# Trois déclencheurs : un tag `vX.Y.Z`, un lancement manuel, ou — le plus
# simple — un changement du numéro de version dans package.json sur main.
# Dans ce dernier cas, la release n'est construite que si son tag n'existe
# pas encore : republier une version déjà sortie n'a pas de sens.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (ex. 1.2.0), sans le v"
        required: true

permissions:
  contents: write

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - name: Cette version est-elle déjà publiée ?
        id: check
        run: |
          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION existe déjà : rien à publier."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # En premier : une dépendance de pair absente casse le build Gradle trois
      # minutes plus tard, ou seulement à l'exécution sur l'appareil.
      - name: Vérifier les dépendances de pair
        run: node scripts/check-peers.mjs

      - name: Vérifier les types
        run: |
          npx tsc --noEmit
          npx tsc --noEmit -p tsconfig.test.json

      - name: Lancer les tests
        run: node --experimental-strip-types --test "src/**/*.test.ts"

      - name: Déterminer la version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          # Android exige un versionCode strictement croissant d'une version à
          # l'autre. Le numéro de run du workflow le garantit sans état à tenir.
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Le SDK Android est déjà installé sur l'image du runner, licences
      # acceptées. `android-actions/setup-android` ajoutait par-dessus un
      # paquet « tools » retiré depuis du dépôt Google, et échouait pour
      # cette seule raison. On se contente de vérifier que le SDK est là —
      # bruyamment, pour qu'un changement d'image ne passe pas inaperçu.
      - name: Vérifier le SDK Android du runner
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME absent"; exit 1; }
          test -d "$ANDROID_HOME/platforms" || { echo "Aucune plateforme installée"; exit 1; }
          ls "$ANDROID_HOME/platforms"

      - name: Générer le projet Android
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          UPDATE_REPO_OWNER: ${{ github.repository_owner }}
          UPDATE_REPO_NAME: ${{ github.event.repository.name }}
        run: npx expo prebuild --platform android --no-install

      - name: Restaurer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Le secret KEYSTORE_BASE64 est absent. Sans clé stable, "\
                 "Android refusera d'installer la mise à jour par-dessus la version "\
                 "précédente. Voir docs/SIGNATURE.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Construire l'APK signée
        working-directory: android
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PKARAKEEP_ABI=arm64-v8a \
            -PreactNativeArchitectures=arm64-v8a \
            -PKARAKEEP_STORE_FILE="$RUNNER_TEMP/release.keystore" \
            -PKARAKEEP_STORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKARAKEEP_KEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKARAKEEP_KEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Vérifier la signature
        run: |
          APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          # Une APK signée avec la clé de debug s'installerait, mais ne pourrait
          # jamais être mise à jour par une version signée correctement.
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::L'APK est signée avec la clé de debug."
            exit 1
          fi

      - name: Renommer l'APK
        run: |
          mkdir -p dist
          cp "$APK" "dist/karakeep-local-${{ steps.version.outputs.tag }}.apk"
          ls -lh dist/

      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          # Le tag est créé sur le commit construit, pas sur la tête de main.
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
